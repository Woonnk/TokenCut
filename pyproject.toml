[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tokencut-agent"
version = "0.3.0"
description = "Inspectable context optimization and token-waste audits for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
tokens = ["tiktoken>=0.7,<1"]
live = ["openai>=1.60,<3"]
dev = ["build>=1,<2", "ruff>=0.9,<1"]

[project.scripts]
tokencut = "tokencut.cli:main"

[tool.setuptools.packages.find]
include = ["tokencut*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
